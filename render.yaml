services:
  - type: web
    name: amoriva-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DB_URL
        value: https://aviabustout-default-rtdb.firebaseio.com
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_WEBHOOK_CHALLENGE
        sync: false
      - key: INTASEND_LIVE
        value: "false"
      - key: APP_URL
        value: https://wazungukonect.vercel.app
      - key: PRICE_AMOUNT
        value: "130"
      - key: PRICE_CURRENCY
        value: "KES"
      - key: COINS_PER_PURCHASE
        value: "30"
      - key: COINS_PER_AD
        value: "10"
